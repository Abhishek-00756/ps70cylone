services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=true
      - SATELLITE_PROVIDER=demo
    volumes:
      - ./data:/repo/data
      - ./ml/models:/repo/ml/models

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
